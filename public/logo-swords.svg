<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="swordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="50%" style="stop-color:#a0a0a0"/>
      <stop offset="100%" style="stop-color:#707070"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6bcb77"/>
      <stop offset="100%" style="stop-color:#2d5a3d"/>
    </linearGradient>
    <filter id="swordGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1a1410" stroke="url(#goldGrad2)" stroke-width="3" opacity="0.9"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.4"/>
  
  <!-- Crossed swords -->
  <!-- Sword 1 (left to right) -->
  <g transform="translate(100,100) rotate(-45)">
    <!-- Blade -->
    <rect x="-3" y="-60" width="6" height="80" fill="url(#swordGrad)" filter="url(#swordGlow)"/>
    <!-- Tip -->
    <polygon points="-3,-60 3,-60 0,-72" fill="url(#swordGrad)"/>
    <!-- Crossguard -->
    <rect x="-15" y="20" width="30" height="6" fill="url(#goldGrad2)" rx="2"/>
    <!-- Handle -->
    <rect x="-3" y="26" width="6" height="18" fill="#3d2b1f"/>
    <!-- Pommel -->
    <circle cx="0" cy="46" r="5" fill="url(#goldGrad2)"/>
  </g>
  
  <!-- Sword 2 (right to left) -->
  <g transform="translate(100,100) rotate(45)">
    <rect x="-3" y="-60" width="6" height="80" fill="url(#swordGrad)" filter="url(#swordGlow)"/>
    <polygon points="-3,-60 3,-60 0,-72" fill="url(#swordGrad)"/>
    <rect x="-15" y="20" width="30" height="6" fill="url(#goldGrad2)" rx="2"/>
    <rect x="-3" y="26" width="6" height="18" fill="#3d2b1f"/>
    <circle cx="0" cy="46" r="5" fill="url(#goldGrad2)"/>
  </g>
  
  <!-- Cannabis leaf in center, behind swords -->
  <g transform="translate(100,100) scale(0.5)" opacity="0.6">
    <path d="M0,-45 Q-8,-35 -25,-25 Q-35,-15 -30,-5 Q-20,-10 -10,-15 Q-5,-20 0,-25 Q5,-20 10,-15 Q20,-10 30,-5 Q35,-15 25,-25 Q8,-35 0,-45 Z" 
          fill="url(#leafGrad2)"/>
    <path d="M0,-10 Q-15,-5 -35,5 Q-45,15 -35,25 Q-20,15 -10,10 Q-5,5 0,0 Q5,5 10,10 Q20,15 35,25 Q45,15 35,5 Q15,-5 0,-10 Z" 
          fill="url(#leafGrad2)"/>
  </g>
  
  <!-- Smoke wisps -->
  <path d="M60,140 Q55,120 65,110 Q70,100 60,90" fill="none" stroke="#6bcb77" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <path d="M140,140 Q145,120 135,110 Q130,100 140,90" fill="none" stroke="#6bcb77" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
</svg>
