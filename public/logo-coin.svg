<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="40%" style="stop-color:#c9a227"/>
      <stop offset="60%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </linearGradient>
    <radialGradient id="coinShine" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#fff8dc;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0"/>
    </radialGradient>
    <filter id="coinGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer coin ring -->
  <circle cx="100" cy="100" r="85" fill="url(#coinGrad)" stroke="#8b6914" stroke-width="3" filter="url(#coinGlow)"/>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#8b6914" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Shine -->
  <circle cx="100" cy="100" r="72" fill="url(#coinShine)"/>
  
  <!-- Cannabis leaf on coin -->
  <g transform="translate(100,100)" opacity="0.85">
    <line x1="0" y1="-40" x2="0" y2="40" stroke="#2d5a3d" stroke-width="1.5"/>
    <path d="M0,-40 Q-7,-30 -22,-22 Q-30,-12 -26,-4 Q-18,-8 -8,-12 Q-4,-16 0,-20 Q4,-16 8,-12 Q18,-8 26,-4 Q30,-12 22,-22 Q7,-30 0,-40 Z" 
          fill="#2d5a3d"/>
    <path d="M0,-8 Q-12,-3 -28,7 Q-35,15 -28,22 Q-16,14 -8,8 Q-4,3 0,0 Q4,3 8,8 Q16,14 28,22 Q35,15 28,7 Q12,-3 0,-8 Z" 
          fill="#2d5a3d" opacity="0.8"/>
    <path d="M0,14 Q-8,18 -20,30 Q-25,38 -16,42 Q-8,34 -4,26 Q0,22 0,18 Q4,22 4,26 Q8,34 16,42 Q25,38 20,30 Q8,18 0,14 Z" 
          fill="#2d5a3d" opacity="0.7"/>
  </g>
  
  <!-- GP text -->
  <text x="100" y="175" text-anchor="middle" font-family="Cinzel, serif" font-size="14" font-weight="bold" fill="#8b6914">GP</text>
</svg>
